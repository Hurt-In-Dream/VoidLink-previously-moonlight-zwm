name: Build VoidLink unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ Integration ]
    paths: [ .github/workflows/build.yml ]

jobs:
  build:
    name: Build unsigned IPA (iOS Release)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build VoidLink without code signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project VoidLink.xcodeproj \
            -target VoidLink \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Release-iphoneos/VoidLink.app build/ipa/Payload/VoidLink.app
          cd build/ipa
          zip -q -r ../VoidLink-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned-IPA
          path: build/VoidLink-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
