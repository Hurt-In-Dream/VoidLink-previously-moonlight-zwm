name: Build VoidLink unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [Integration]
    paths:
      - .github/workflows/build.yml
      - BuildScripts/build-unsigned-ipa.sh
      - BuildScripts/verify-ipa.py
      - VoidLink.xcodeproj/xcshareddata/xcschemes/VoidLink.xcscheme

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA (iOS Release)
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Integration
          submodules: recursive
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive, package and verify unsigned IPA
        run: bash BuildScripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned-IPA
          path: |
            build/VoidLink-unsigned.ipa
            build/VoidLink-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
